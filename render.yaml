services:
  - type: web
    name: senati-labreserve-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: bd_reservas_laboratorios_senati
      - key: API_WRITE_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
